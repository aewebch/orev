<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--color-surface)}.t{font-size:11px;font-family:ui-monospace,Menlo,monospace;color:var(--color-text-muted);line-height:1.4}.n{font-size:13px;font-weight:700}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:16px}.k{height:56px;border-radius:10px;box-shadow:var(--shadow-ring);margin-bottom:8px}</style></head><body><div class="g"><div class="s"><div class="k" style="background:var(--color-success)"></div><div class="n">Success</div><div class="t">--color-success<br>#05BF66</div></div><div class="s"><div class="k" style="background:var(--color-warning)"></div><div class="n">Warning</div><div class="t">--color-warning<br>#E9A533</div></div><div class="s"><div class="k" style="background:var(--color-danger)"></div><div class="n">Danger</div><div class="t">--color-danger<br>#EE4110</div></div><div class="s"><div class="k" style="background:var(--color-info)"></div><div class="n">Info</div><div class="t">--color-info<br>= secondary</div></div></div></body></html>
