<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--color-surface)}.t{font-size:11px;font-family:ui-monospace,Menlo,monospace;color:var(--color-text-muted);line-height:1.4}.n{font-size:13px;font-weight:700}body{background:var(--color-page-bg)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:24px"><div><div style="height:64px;background:#fff;border-radius:10px;box-shadow:var(--shadow-card);margin-bottom:10px"></div><div class="n">Card / panel</div><div class="t">--shadow-card</div></div><div><div style="height:64px;background:#fff;border-radius:10px;box-shadow:var(--shadow-soft);margin-bottom:10px"></div><div class="n">Avatar, icon btn</div><div class="t">--shadow-soft</div></div><div><div style="height:64px;background:#fff;border-radius:10px;box-shadow:var(--shadow-ring);margin-bottom:10px"></div><div class="n">Outline ring</div><div class="t">--shadow-ring</div></div><div><div style="height:64px;background:#fff;border-radius:10px;box-shadow:var(--shadow-focus);margin-bottom:10px"></div><div class="n">Focus (inset)</div><div class="t">--shadow-focus</div></div><div><div style="height:64px;background:#fff;border-radius:10px;box-shadow:var(--shadow-input-focus);margin-bottom:10px"></div><div class="n">Input focus</div><div class="t">--shadow-input-focus</div></div><div><div style="height:64px;background:#fff;border-radius:10px;box-shadow:var(--shadow-modal);margin-bottom:10px"></div><div class="n">Modal</div><div class="t">--shadow-modal</div></div><div><div style="height:64px;background:#fff;border-radius:10px;box-shadow:var(--shadow-tooltip);margin-bottom:10px"></div><div class="n">Tooltip</div><div class="t">--shadow-tooltip</div></div></div></body></html>
