<!-- @dsCard group="Colors" viewport="700x150" name="Neutral & surfaces" subtitle="Text, muted text, surface, page background" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--color-surface)}.t{font-size:11px;font-family:ui-monospace,Menlo,monospace;color:var(--color-text-muted);line-height:1.4}.n{font-size:13px;font-weight:700}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:16px}.k{height:56px;border-radius:10px;box-shadow:var(--shadow-ring);margin-bottom:8px}</style></head><body><div class="g"><div class="s"><div class="k" style="background:var(--color-text)"></div><div class="n">Text</div><div class="t">--color-text<br>#2F313B</div></div><div class="s"><div class="k" style="background:var(--color-text-muted)"></div><div class="n">Text muted</div><div class="t">--color-text-muted<br>text / 60%</div></div><div class="s"><div class="k" style="background:var(--color-surface)"></div><div class="n">Surface</div><div class="t">--color-surface<br>#FFFFFF</div></div><div class="s"><div class="k" style="background:var(--color-page-bg)"></div><div class="n">Page bg</div><div class="t">--color-page-bg<br>#EEF1F7</div></div><div class="s"><div class="k" style="background:var(--color-page-bg-hover)"></div><div class="n">Page bg hover</div><div class="t">--color-page-bg-hover<br>page-bg + 8% text</div></div></div></body></html>
