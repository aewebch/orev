<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--color-surface)}.t{font-size:11px;font-family:ui-monospace,Menlo,monospace;color:var(--color-text-muted);line-height:1.4}.n{font-size:13px;font-weight:700}.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}.tt{flex:1;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px}.n{text-transform:capitalize}</style></head><body><div class="row"><div class="n" style="width:90px">primary</div><div class="tt" style="background:var(--primary-5)"><span>5%</span></div><div class="tt" style="background:var(--primary-10)"><span>10%</span></div><div class="tt" style="background:var(--primary-20)"><span>20%</span></div><div class="tt" style="background:var(--color-primary)"><span style="color:#fff">100%</span></div><div class="tt" style="background:var(--primary-20);border:1px solid var(--primary-10);color:var(--primary-ink);font-weight:700;font-size:13px">Ink text</div></div><div class="row"><div class="n" style="width:90px">secondary</div><div class="tt" style="background:var(--secondary-5)"><span>5%</span></div><div class="tt" style="background:var(--secondary-10)"><span>10%</span></div><div class="tt" style="background:var(--secondary-20)"><span>20%</span></div><div class="tt" style="background:var(--color-secondary)"><span style="color:#fff">100%</span></div><div class="tt" style="background:var(--secondary-20);border:1px solid var(--secondary-10);color:var(--secondary-ink);font-weight:700;font-size:13px">Ink text</div></div><div class="row"><div class="n" style="width:90px">success</div><div class="tt" style="background:var(--success-5)"><span>5%</span></div><div class="tt" style="background:var(--success-10)"><span>10%</span></div><div class="tt" style="background:var(--success-20)"><span>20%</span></div><div class="tt" style="background:var(--color-success)"><span style="color:#fff">100%</span></div><div class="tt" style="background:var(--success-20);border:1px solid var(--success-10);color:var(--success-ink);font-weight:700;font-size:13px">Ink text</div></div><div class="row"><div class="n" style="width:90px">warning</div><div class="tt" style="background:var(--warning-5)"><span>5%</span></div><div class="tt" style="background:var(--warning-10)"><span>10%</span></div><div class="tt" style="background:var(--warning-20)"><span>20%</span></div><div class="tt" style="background:var(--color-warning)"><span style="color:#fff">100%</span></div><div class="tt" style="background:var(--warning-20);border:1px solid var(--warning-10);color:var(--warning-ink);font-weight:700;font-size:13px">Ink text</div></div><div class="row"><div class="n" style="width:90px">danger</div><div class="tt" style="background:var(--danger-5)"><span>5%</span></div><div class="tt" style="background:var(--danger-10)"><span>10%</span></div><div class="tt" style="background:var(--danger-20)"><span>20%</span></div><div class="tt" style="background:var(--color-danger)"><span style="color:#fff">100%</span></div><div class="tt" style="background:var(--danger-20);border:1px solid var(--danger-10);color:var(--danger-ink);font-weight:700;font-size:13px">Ink text</div></div></body></html>
