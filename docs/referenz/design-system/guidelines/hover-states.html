<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--color-surface)}.t{font-size:11px;font-family:ui-monospace,Menlo,monospace;color:var(--color-text-muted);line-height:1.4}.n{font-size:13px;font-weight:700}body{background:var(--color-surface)}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px;align-items:start"><div><div class="n" style="margin-bottom:8px">Rest</div><button class="ae-btn ae-btn--primary ae-btn--md">Speichern</button></div><div><div class="n" style="margin-bottom:8px">Hover</div><button class="ae-btn ae-btn--primary ae-btn--md" style="background:var(--color-primary-hover);box-shadow:var(--shadow-hover-ring)">Speichern</button></div><div><div class="n" style="margin-bottom:8px">Focus-visible</div><button class="ae-btn ae-btn--secondary ae-btn--md" style="box-shadow:var(--shadow-focus)">Bearbeiten</button></div><label class="ae-input"><span class="ae-input__label">Rest</span><span class="ae-input__row"><input class="ae-input__field" placeholder="Wert"></span></label><label class="ae-input" style="box-shadow:var(--shadow-ring) inset"><span class="ae-input__label">Hover</span><span class="ae-input__row"><input class="ae-input__field" placeholder="Wert"></span></label><label class="ae-input" style="background:#fff;box-shadow:var(--shadow-input-focus)"><span class="ae-input__label">:focus-within</span><span class="ae-input__row"><input class="ae-input__field" value="Wert"></span></label></div></body></html>
