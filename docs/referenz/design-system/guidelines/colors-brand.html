<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--color-surface)}.t{font-size:11px;font-family:ui-monospace,Menlo,monospace;color:var(--color-text-muted);line-height:1.4}.n{font-size:13px;font-weight:700}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:16px}.k{height:56px;border-radius:10px;box-shadow:var(--shadow-ring);margin-bottom:8px}</style></head><body><div class="g"><div class="s"><div class="k" style="background:var(--color-primary)"></div><div class="n">Primary</div><div class="t">--color-primary<br>#4DA19F</div></div><div class="s"><div class="k" style="background:var(--color-primary-hover)"></div><div class="n">Primary hover</div><div class="t">--color-primary-hover<br>#2C5D5C</div></div><div class="s"><div class="k" style="background:var(--color-secondary)"></div><div class="n">Secondary</div><div class="t">--color-secondary<br>#00427C</div></div><div class="s"><div class="k" style="background:var(--gradient-cta)"></div><div class="n">Gradient CTA</div><div class="t">--gradient-cta<br>104deg primary→secondary</div></div></div></body></html>
