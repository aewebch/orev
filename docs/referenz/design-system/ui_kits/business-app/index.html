<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><title>aeweb — Business App UI kit</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head><body><div id="root"></div>
<script type="text/babel" src="Login.jsx"></script><script type="text/babel" src="Shell.jsx"></script><script type="text/babel" src="Screens.jsx"></script>
<script type="text/babel">
function App() {
  const [user, setUser] = React.useState(localStorage.getItem('aeKitUser'));
  const [page, setPage] = React.useState('dash');
  const [modal, setModal] = React.useState(undefined);
  const login = e => { const n = e.startsWith('partner') ? 'Partner Konto' : 'Anna Keller'; localStorage.setItem('aeKitUser', n); setUser(n); };
  const logout = () => { localStorage.removeItem('aeKitUser'); setUser(null); };
  if (!user) return <LoginScreen onLogin={login} />;
  return <Shell page={page} setPage={setPage} user={user} onLogout={logout}>
    {page === 'dash' && <Dashboard openUser={setModal} />}
    {page === 'users' && <UserList openUser={setModal} />}
    {page === 'set' && <Settings />}
    {page === 'docs' && <Empty label="Dokumente" />}
    {modal !== undefined && <UserModal user={modal} onClose={() => setModal(undefined)} />}
  </Shell>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
